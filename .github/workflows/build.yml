name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Version'
        required: true
        default: 'v2.3.0'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid

      - name: Setup Theos and iOS SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ github.workspace }}/theos
          rm -rf ${{ github.workspace }}/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git ${{ github.workspace }}/theos/sdks

      - name: Compile and Package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          
          mkdir -p output
          find .theos/obj -name "YTBackgroundOnly.dylib" -exec cp {} output/ \;
          cp packages/*.deb output/
          
          cd output
          zip -j YTBackgroundOnly.dylib.zip YTBackgroundOnly.dylib
          zip -j YTBackgroundOnly.deb.zip *.deb
          rm -f YTBackgroundOnly.dylib *.deb

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YTBackgroundOnly-Release-Zips
          path: output/*.zip

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: output/*.zip
          generate_release_notes: true
